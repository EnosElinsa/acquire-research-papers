[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "acquire-research-papers"
version = "0.6.0"
description = "Codex skill and CLI for verified paper acquisition, library management, and author discovery"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = [
  "academic-research",
  "bibtex",
  "codex-skill",
  "literature-review",
  "research-papers",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "httpx>=0.28,<1",
  "jsonschema>=4.23,<5",
  "platformdirs>=4.3,<5",
  "python-dotenv>=1.1,<2",
  "pybtex>=0.25,<1",
  "pypdf>=6.14.2,<7",
  "PyYAML>=6.0,<7",
]

[project.scripts]
arp = "acquire_research_papers.cli:main"

[project.urls]
Homepage = "https://github.com/EnosElinsa/acquire-research-papers"
Issues = "https://github.com/EnosElinsa/acquire-research-papers/issues"
Repository = "https://github.com/EnosElinsa/acquire-research-papers"
Documentation = "https://github.com/EnosElinsa/acquire-research-papers#readme"
Changelog = "https://github.com/EnosElinsa/acquire-research-papers/blob/main/CHANGELOG.md"
Support = "https://github.com/EnosElinsa/acquire-research-papers/blob/main/SUPPORT.md"

[tool.hatch.build]
exclude = ["/docs"]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-httpserver>=1.1,<2",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/acquire_research_papers"]

[tool.hatch.build.targets.wheel.force-include]
"scripts/credential-status.ps1" = "acquire_research_papers/_scripts/credential-status.ps1"
"scripts/ieee-playwright.mjs" = "acquire_research_papers/_scripts/ieee-playwright.mjs"
"scripts/install-playwright.ps1" = "acquire_research_papers/_scripts/install-playwright.ps1"
"scripts/migrate-legacy-secrets.ps1" = "acquire_research_papers/_scripts/migrate-legacy-secrets.ps1"
"scripts/read-browser-credential.ps1" = "acquire_research_papers/_scripts/read-browser-credential.ps1"
"scripts/read-discovery-api-key.ps1" = "acquire_research_papers/_scripts/read-discovery-api-key.ps1"
"scripts/read-elsevier-api-key.ps1" = "acquire_research_papers/_scripts/read-elsevier-api-key.ps1"
"scripts/read-institution-profile.ps1" = "acquire_research_papers/_scripts/read-institution-profile.ps1"
"scripts/read-mineru-token.ps1" = "acquire_research_papers/_scripts/read-mineru-token.ps1"
"scripts/secret-store.ps1" = "acquire_research_papers/_scripts/secret-store.ps1"
"scripts/setup-discovery-api-keys.ps1" = "acquire_research_papers/_scripts/setup-discovery-api-keys.ps1"
"scripts/setup-elsevier-api-key.ps1" = "acquire_research_papers/_scripts/setup-elsevier-api-key.ps1"
"scripts/setup-ieee-institution.ps1" = "acquire_research_papers/_scripts/setup-ieee-institution.ps1"
"scripts/setup-ieee-profile-credential.ps1" = "acquire_research_papers/_scripts/setup-ieee-profile-credential.ps1"
"scripts/setup-mineru-token.ps1" = "acquire_research_papers/_scripts/setup-mineru-token.ps1"
"scripts/setup-secrets.ps1" = "acquire_research_papers/_scripts/setup-secrets.ps1"
"scripts/update-ieee-institution-entity.ps1" = "acquire_research_papers/_scripts/update-ieee-institution-entity.ps1"
"scripts/update-ieee-institution-route.ps1" = "acquire_research_papers/_scripts/update-ieee-institution-route.ps1"
"schemas" = "acquire_research_papers/_schemas"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
