# Weekly dependency updates. Minor and patch bumps arrive grouped in one pull request per
# ecosystem; major bumps arrive one per dependency so each can be reviewed on its own.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
