name: docs

# Builds the English and Chinese documentation sites with `--strict` on every push and pull
# request that changes them, and publishes both to GitHub Pages from main.
on:
  push:
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "mkdocs.zh.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs-site/**"
      - "mkdocs.yml"
      - "mkdocs.zh.yml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NO_MKDOCS_2_WARNING: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install documentation dependencies
        run: uv sync --locked --only-group docs
      - name: Build English site
        run: uv run --no-sync mkdocs build --strict
      - name: Build Chinese site
        run: uv run --no-sync mkdocs build --strict -f mkdocs.zh.yml
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
