name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        # The default dev group; the docs group is installed only by the docs workflow.
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check src tests scripts skills/acquire-research-papers/scripts
      - name: Type check
        run: uv run mypy
      - name: Test Python with coverage
        run: uv run pytest -q --cov --cov-report=term
      - name: Coverage summary
        if: always() && hashFiles('.coverage') != ''
        shell: bash
        run: |
          echo "### Coverage: ${{ matrix.os }}, Python ${{ matrix.python }}" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Validate skill
        run: uv run python scripts/validate_skill.py .
      - name: Build thin skill and wheel
        run: uv run python scripts/build_distribution.py --update-source-manifest
      - name: Validate exported skill
        run: uv run python scripts/validate_skill.py dist/skills/acquire-research-papers
      - name: Test browser helpers
        if: runner.os == 'Windows'
        run: node --test tests/node/test-ieee-playwright.mjs tests/node/test-ieee-profiles.mjs
      - name: Test credential store
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/powershell/test-secret-store.ps1
      - name: Test pinned Playwright installer
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/powershell/test-install-playwright.ps1
      - name: Test named profile credential isolation
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/powershell/test-ieee-profiles.ps1
