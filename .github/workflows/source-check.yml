name: weekly source check

# Live check that venue presets and official proceedings indexes still work; see
# scripts/check_sources.py. OpenAlex presets need the OPENALEX_API_KEY repository secret and
# are reported as skipped without it. A failed run means an upstream change to fix.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Install dependencies
        run: uv sync --locked
      - name: Check presets and official indexes
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: uv run python scripts/check_sources.py > source-check.json
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-check
          path: source-check.json
